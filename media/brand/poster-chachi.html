<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>צ'אצ'י X ויויאן — ריקאברי בר · סטודיו תות</title>
<style>
  @font-face{font-family:Tut;src:url('../../fonts/anomalia-ultrabold-aaa.otf');font-weight:900}
  @font-face{font-family:Tut;src:url('../../fonts/anomalia-demibold-aaa.otf');font-weight:600}
  @font-face{font-family:TutText;src:url('../../fonts/almoni-tzar-light-aaa.otf');font-weight:300}
  @font-face{font-family:TutText;src:url('../../fonts/almoni-tzar-demibold-aaa.otf');font-weight:600}
  @font-face{font-family:TutMono;src:url('../../fonts/index-mono-bold-aaa.otf')}

  :root{ --red:#ef1c21; --clay:#c2603c; --olive:#3f6b52; --ink:#000; --paper:#fffbff; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e9e9e9;display:flex;justify-content:center}

  .poster{width:1080px;height:1350px;background:var(--red);padding:24px}
  .paper{
    width:100%;height:100%;background:var(--paper);
    padding:40px 60px 30px;display:flex;flex-direction:column;position:relative;
  }
  .bh{position:absolute;top:18px;left:26px;font:300 19px TutText;color:#111}

  /* ---- header ---- */
  header{display:flex;align-items:center;justify-content:space-between}
  .wordmark{width:296px;display:block}
  .daycircle{
    width:168px;height:168px;border-radius:50%;background:var(--red);
    box-shadow:0 0 0 9px var(--paper), 0 0 0 14px var(--clay);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-8deg);
  }
  .daycircle b{font:900 54px/1 Tut;color:#000;letter-spacing:-1px}
  .daycircle span{font:400 13px/1 TutMono;color:#000;margin-top:7px;letter-spacing:2px}

  /* ---- art ---- */
  .art{margin:20px 0 0}
  .art svg{width:100%;display:block}

  /* ---- headline ---- */
  h1{font:900 96px/.94 Tut;letter-spacing:-2px;text-align:right;margin-top:20px}
  h1 i{color:var(--red);font-style:normal}
  .kicker{display:flex;align-items:center;gap:22px;margin-top:14px}
  .tag{background:var(--olive);color:var(--paper);font:900 34px/1 Tut;padding:11px 24px}
  .lat{font:400 23px/1 TutMono;letter-spacing:8px;color:#111}

  .rule{height:4px;background:#000;margin-top:20px}
  .rule.thin{height:2px}

  .lede{font:300 36px/1.3 TutText;text-align:right;margin:18px 0 0}
  .lede em{font-weight:600;font-style:normal}
  .lede b{color:var(--clay);font-weight:600}

  /* ---- details ---- */
  .details{display:flex;align-items:center;gap:34px;margin-top:18px}
  .col-when{text-align:right;padding-left:34px;border-left:3px solid #000}
  .col-when .big{font:900 50px/1.14 Tut;letter-spacing:-1px}
  .col-when .sub{font:300 27px/1.3 TutText;margin-top:6px;color:#222}
  .col-who{flex:1;display:flex;flex-direction:column;gap:12px;text-align:center}
  .col-who .n{font:400 30px/1 TutMono;letter-spacing:12px;padding-right:12px}
  .col-who .n.hb{font:600 32px/1 TutText;letter-spacing:7px}

  .bullets{font:900 32px/1 Tut;text-align:center;padding:16px 0}
  .bullets i{color:var(--red);font-style:normal;padding:0 10px}
  .bullets i.c{color:var(--clay)} .bullets i.o{color:var(--olive)}

  footer{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:13px;padding-top:14px}
  footer svg{width:34px;height:34px}
  footer span{font:400 29px/1 TutMono;letter-spacing:10px;padding-right:10px}
</style>

<div class="poster"><div class="paper">
  <div class="bh">ב"ה</div>

  <header>
    <img class="wordmark" src="wordmark-studio-tut.png" alt="סטודיו תות">
    <div class="daycircle"><b>שישי</b><span>ONE&nbsp;TIME&nbsp;ONLY</span></div>
  </header>

  <div class="art">
  <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#000" stroke-width="3">
      <rect x="1.5" y="1.5" width="285" height="397"/>
      <rect x="296.5" y="1.5" width="316" height="397"/>
      <rect x="622.5" y="1.5" width="336" height="397"/>
    </g>

    <!-- ===== RIGHT PANEL: arch · red sun · stairs ===== -->
    <clipPath id="cR"><rect x="624" y="3" width="333" height="394"/></clipPath>
    <g clip-path="url(#cR)">
      <circle cx="872" cy="98" r="50" fill="#ef1c21"/>
      <path d="M666 400 V236 a92 92 0 0 1 184 0 V400" fill="none" stroke="#000" stroke-width="28"/>
      <path d="M710 400 V236 a48 48 0 0 1 96 0 V400" fill="none" stroke="#c2603c" stroke-width="11"/>
      <path d="M734 400 V238 a24 24 0 0 1 48 0 V400" fill="none" stroke="#3f6b52" stroke-width="5"/>
      <path d="M846 400 V308 h38 V270 h38 V232 h38 V400 Z" fill="#c2603c"/>
      <rect x="624" y="374" width="336" height="6" fill="#000"/>
    </g>

    <!-- ===== MIDDLE PANEL: bar shelf, black base, badge ===== -->
    <clipPath id="cM"><rect x="298" y="3" width="313" height="394"/></clipPath>
    <g clip-path="url(#cM)">
      <!-- solid black base (bottom half) -->
      <rect x="298" y="222" width="313" height="178" fill="#264234"/>
      <!-- shaker -->
      <g stroke="#000" stroke-width="4" fill="#fffbff">
        <path d="M330 222 V126 l12 -32 h54 l12 32 V222 Z"/>
        <rect x="338" y="66" width="66" height="26" fill="#c2603c"/>
        <path d="M350 66 V50 h42 v16"/>
      </g>
      <!-- striped bottle -->
      <g stroke="#000" stroke-width="4" fill="#fffbff">
        <path d="M432 222 V116 c0 -22 15 -26 15 -45 V40 h-30 v31 c0 19 15 23 15 45 V222 Z"/>
      </g>
      <g stroke="#c2603c" stroke-width="5">
        <path d="M419 132 h26 M419 146 h26 M419 160 h26 M419 174 h26 M419 188 h26"/>
      </g>
      <!-- solid bottle -->
      <path d="M498 222 V122 c0 -22 -14 -26 -14 -44 V46 h28 v32 c0 18 14 22 14 44 V222 Z" fill="#3f6b52"/>
      <!-- coupe on the shelf -->
      <g stroke="#000" stroke-width="4" fill="none">
        <path d="M540 150 h56 a28 28 0 0 1 -56 0 Z" fill="#000"/>
        <path d="M568 178 V210 M548 214 h40"/>
      </g>
      <circle cx="600" cy="140" r="20" fill="#ef1c21" stroke="#000" stroke-width="3"/>
      <g stroke="#000" stroke-width="2">
        <path d="M600 120 v40 M580 140 h40 M586 126 l28 28 M614 126 l-28 28"/>
      </g>
      <!-- shelf line -->
      <rect x="298" y="216" width="313" height="7" fill="#000"/>
    </g>
    <!-- badge, straddling the black edge -->
    <g transform="translate(454 222)">
      <circle r="97" fill="#fffbff" stroke="#000" stroke-width="4"/>
      <circle r="86" fill="none" stroke="#000" stroke-width="2"/>
      <text y="-16" text-anchor="middle" font-family="Tut" font-weight="900" font-size="40" fill="#000">ריקאברי</text>
      <text y="24" text-anchor="middle" font-family="Tut" font-weight="900" font-size="40" fill="#000">בר</text>
      <text y="56" text-anchor="middle" font-family="TutMono" font-size="12" letter-spacing="2.8" fill="#000">RECOVERY BAR</text>
    </g>

    <!-- ===== LEFT PANEL: צ'אצ'י — halftone portrait ===== -->
    <clipPath id="cL"><rect x="3" y="3" width="282" height="394"/></clipPath>
    <g clip-path="url(#cL)">
      <image href="chachi-halftone.png" x="3" y="3" width="282" height="394"
             preserveAspectRatio="xMidYMid slice"/>
    </g>
    <!-- name plate over the portrait -->
    <g>
      <rect x="3" y="331" width="180" height="60" fill="#fffbff" stroke="#264234" stroke-width="3"/>
      <text x="91" y="374" text-anchor="middle" font-family="Tut" font-weight="900"
            font-size="36" fill="#3f6b52">צ'אצ'י</text>
    </g>
  </svg>
  </div>

  <h1>צ'אצ'י <i>X</i> ויויאן</h1>

  <div class="kicker">
    <div class="tag">ריקאברי בר</div>
    <div class="lat">b y &nbsp; V i v i a n &nbsp; X</div>
  </div>

  <div class="rule"></div>

  <p class="lede">
    צ'אצ'י המיקסולוג האגדי מגיע לעשות <em>back to back</em><br>
    עם ויויאן שלנו <b>לבר חד פעמי</b>.
  </p>

  <div class="rule thin"></div>

  <div class="details">
    <div class="col-when">
      <div class="big" dir="ltr">12:00-18:00</div>
      <div class="big">מגן אברהם 6</div>
      <div class="sub">יום שישי · תל אביב</div>
    </div>
    <div class="col-who">
      <div class="n hb">צ ' א צ ' י</div>
      <div class="n">V I V I A N</div>
    </div>
  </div>

  <div class="rule thin"></div>
  <div class="bullets">ואנחנו <i>•</i> מוזיקה <i class="c">•</i> קוקטיילים <i class="o">•</i> ריקאברי <i class="c">•</i> צהריים</div>
  <div class="rule thin" style="margin-top:0"></div>

  <footer>
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9">
      <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5"/>
      <circle cx="12" cy="12" r="4.6"/><circle cx="17.6" cy="6.4" r="1.3" fill="#000" stroke="none"/>
    </svg>
    <span>tutlavi_studio</span>
  </footer>

</div></div>
</html>

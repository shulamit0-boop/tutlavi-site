<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>צ'אצ'י X ויויאן — Pop up Cocktail party · סטודיו תות</title>
<style>
  @font-face{font-family:Tut;src:url('../../fonts/anomalia-ultrabold-aaa.otf');font-weight:900}
  @font-face{font-family:Tut;src:url('../../fonts/anomalia-demibold-aaa.otf');font-weight:600}
  @font-face{font-family:TutText;src:url('../../fonts/almoni-tzar-light-aaa.otf');font-weight:300}
  @font-face{font-family:TutText;src:url('../../fonts/almoni-tzar-demibold-aaa.otf');font-weight:600}
  @font-face{font-family:TutMono;src:url('../../fonts/index-mono-bold-aaa.otf')}

  :root{ --red:#ef1c21; --ink:#000; --paper:#fffbff;
          --clay:#000; --olive:#000; --deep:#000; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e9e9e9;display:flex;justify-content:center}

  .poster{width:1080px;height:1350px;background:var(--red);padding:24px}
  .paper{
    width:100%;height:100%;background:var(--paper);
    padding:38px 60px 28px;display:flex;flex-direction:column;position:relative;
  }
  .bh{position:absolute;top:16px;left:26px;font:300 19px TutText;color:#111}

  /* ---- header ---- */
  header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between}
  .wordmark{width:290px;display:block}
  .daycircle{
    width:188px;height:188px;border-radius:50%;background:var(--red);
    box-shadow:0 0 0 9px var(--paper), 0 0 0 14px var(--clay);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-8deg);
  }
  .daycircle b{font:900 30px/1 Tut;color:#000;letter-spacing:-.5px}
  .daycircle span{font:900 52px/1 Tut;color:#000;margin-top:10px;letter-spacing:-1px}

  /* ---- art ---- */
  .art{flex:0 0 auto;margin:16px 0 0}
  .art svg{width:100%;display:block}

  /* ---- headline ---- */
  h1{flex:0 0 auto;font:900 88px/.94 Tut;letter-spacing:-2px;text-align:right;margin-top:18px}
  h1 i{color:var(--red);font-style:normal}
  .kicker{display:flex;align-items:center;gap:22px;margin-top:13px}
  .tag{background:var(--olive);color:var(--paper);font:900 32px/1 Tut;padding:10px 22px}
  .lat{font:400 22px/1 TutMono;letter-spacing:8px;color:#111}

  .rule{flex:0 0 auto;height:4px;background:#000;margin-top:17px}
  .rule.thin{height:2px}

  .lede{flex:0 0 auto;font:300 38px/1.3 TutText;text-align:center;margin:16px 0 0}
  .lede em{font-weight:600;font-style:normal}
  .lede b{color:var(--red);font-weight:600}

  /* ---- details ---- */
  .details{flex:0 0 auto;display:flex;align-items:center;margin-top:18px}
  .col-when{flex:1;text-align:center;padding:0 26px 0 44px;border-left:3px solid #000}
  .col-when .big{font:900 46px/1.14 Tut;letter-spacing:-1px}
  .col-when .sub{font:300 27px/1.3 TutText;margin-top:6px;color:#222}
  .col-who{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 44px 0 26px}
  .col-who .lbl{font:600 27px/1 TutText;letter-spacing:6px;color:#222;padding-right:6px}
  .col-who .dj{font:900 48px/1 Tut;letter-spacing:-1px}

  .bullets{flex:0 0 auto;font:900 36px/1 Tut;text-align:center;padding:14px 0;letter-spacing:6px}
  .bullets i{color:var(--red);font-style:normal;letter-spacing:0}

  footer{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:13px;padding-top:12px}
  footer svg{width:32px;height:32px}
  footer span{font:400 27px/1 TutMono;letter-spacing:10px;padding-right:10px}

  /* palette hooks — CSS wins over the SVG presentation attributes */
  .f-clay{fill:var(--clay)}   .s-clay{stroke:var(--clay)}
  .f-olive{fill:var(--olive)} .s-olive{stroke:var(--olive)}
  .f-deep{fill:var(--deep)}

  /* middle-panel variants */
  .v-illus{display:none}
  .poster.illus .v-photo{display:none}
  .poster.illus .v-illus{display:inline}

  /* optional run: riso tones (clay + bottle green) */
  .poster.tones{ --clay:#c2603c; --olive:#3f6b52; --deep:#264234; }
  .poster.tones .lede b{color:var(--clay)}
</style>

<div class="poster"><div class="paper">
  <div class="bh">ב"ה</div>

  <header>
    <img class="wordmark" src="wordmark-studio-tut.png" alt="סטודיו תות">
    <div class="daycircle"><b>שישי צהריים</b><span>31/7</span></div>
  </header>

  <div class="art">
  <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#000" stroke-width="3">
      <rect x="1.5"   y="1.5" width="334" height="397"/>
      <rect x="347.5" y="1.5" width="314" height="397"/>
      <rect x="673.5" y="1.5" width="285" height="397"/>
    </g>

    <!-- ============ LEFT PANEL: DJ booth, after the opening-party poster ============ -->
    <clipPath id="cL"><rect x="3" y="3" width="331" height="394"/></clipPath>
    <g clip-path="url(#cL)">
      <!-- arch -->
      <path d="M28 397 V150 a136 136 0 0 1 272 0 V397" fill="none" stroke="#000" stroke-width="3"/>
      <!-- red sun -->
      <circle cx="188" cy="122" r="70" fill="#ef1c21"/>
      <!-- organic blob -->
      <path d="M28 120 C78 116 114 148 108 188
               C102 224 132 232 170 240
               C208 248 234 250 248 258
               L28 258 Z" fill="#000"/>

      <!-- ---- console ---- -->
      <!-- deck slab -->
      <path d="M24 262 Q166 253 312 262 L312 300 L24 300 Z" fill="#fffbff" stroke="#000" stroke-width="3"/>
      <!-- laptop, standing on the deck -->
      <g stroke="#000" stroke-width="3" fill="#fffbff">
        <path d="M58 250 L120 250 L132 196 L70 196 Z"/>
        <path d="M40 250 L132 250 L142 264 L30 264 Z"/>
      </g>
      <!-- left controller -->
      <g stroke="#000" stroke-width="2" fill="none">
        <rect x="32" y="270" width="46" height="22"/>
        <path d="M38 276 h34 M38 282 h34 M38 288 h34"/>
      </g>
      <!-- turntable 1 -->
      <ellipse cx="122" cy="281" rx="32" ry="15" fill="#000"/>
      <ellipse cx="122" cy="281" rx="9"  ry="4.5" fill="#ef1c21"/>
      <!-- mixer -->
      <g stroke="#000" stroke-width="2" fill="none">
        <rect x="166" y="266" width="42" height="30"/>
        <path d="M174 272 v18 M187 272 v18 M200 272 v18"/>
      </g>
      <circle cx="174" cy="292" r="3" fill="#000"/>
      <circle cx="200" cy="292" r="3" fill="#000"/>
      <!-- turntable 2 -->
      <ellipse cx="256" cy="281" rx="32" ry="15" fill="#000"/>
      <ellipse cx="256" cy="281" rx="9"  ry="4.5" fill="#ef1c21"/>

      <!-- ---- stepped riser ---- -->
      <g stroke="#000" stroke-width="2" fill="none">
        <path d="M30 318 H310 M30 336 H310 M30 354 H310 M30 372 H310 M30 388 H310"/>
      </g>
      <path d="M312 300 H248 V318 H188 V336 H126 V354 H24" fill="none" stroke="#000" stroke-width="3"/>
    </g>

    <!-- ================= MIDDLE PANEL ================= -->
    <clipPath id="cM"><rect x="348.5" y="2.5" width="314" height="395"/></clipPath>

    <!-- version A: halftone portrait + small badge -->
    <g class="v-photo">
      <g clip-path="url(#cM)">
        <image href="chachi-halftone.png" x="346" y="0" width="320" height="400"
               preserveAspectRatio="xMidYMid slice"/>
      </g>
      <g transform="translate(505 312)">
        <circle r="86" fill="#fffbff" stroke="#000" stroke-width="4"/>
        <circle r="77" fill="none" stroke="#000" stroke-width="2"/>
        <path id="arcTopS" d="M -62 0 A 62 62 0 0 1 62 0" fill="none"/>
        <path id="arcBotS" d="M -62 0 A 62 62 0 0 0 62 0" fill="none"/>
        <text font-family="Tut" font-weight="900" font-size="19" letter-spacing="2" fill="#000">
          <textPath href="#arcTopS" startOffset="50%" text-anchor="middle">COCKTAIL</textPath>
        </text>
        <text font-family="Tut" font-weight="900" font-size="19" letter-spacing="2" fill="#000">
          <textPath href="#arcBotS" startOffset="50%" text-anchor="middle" side="right">PARTY</textPath>
        </text>
        <text y="11" text-anchor="middle" font-family="Tut" font-weight="900" font-size="42" fill="#000">POP UP</text>
        <circle cx="0" cy="36" r="6" fill="#ef1c21"/>
      </g>
    </g>

    <!-- version B: giant badge on a clean panel -->
    <g class="v-illus">
      <g clip-path="url(#cM)"><rect x="349" y="222" width="313" height="175" fill="#000"/></g>
      <g transform="translate(505 222)">
        <circle r="147" fill="#fffbff" stroke="#000" stroke-width="5"/>
        <circle r="134" fill="none" stroke="#000" stroke-width="2"/>
        <path id="arcTop" d="M -112 0 A 112 112 0 0 1 112 0" fill="none"/>
        <path id="arcBot" d="M -112 0 A 112 112 0 0 0 112 0" fill="none"/>
        <text font-family="Tut" font-weight="900" font-size="34" letter-spacing="3" fill="#000">
          <textPath href="#arcTop" startOffset="50%" text-anchor="middle">COCKTAIL</textPath>
        </text>
        <text font-family="Tut" font-weight="900" font-size="34" letter-spacing="3" fill="#000">
          <textPath href="#arcBot" startOffset="50%" text-anchor="middle" side="right">PARTY</textPath>
        </text>
        <text y="18" text-anchor="middle" font-family="Tut" font-weight="900" font-size="74" fill="#000">POP UP</text>
        <circle cx="0" cy="62" r="9" fill="#ef1c21"/>
      </g>
    </g>

    <!-- ================= RIGHT PANEL: coupe + highball ================= -->
    <clipPath id="cR"><rect x="675" y="3" width="282" height="394"/></clipPath>
    <g clip-path="url(#cR)">
      <!-- highball -->
      <path class="f-deep" d="M834 152 h92 l-10 222 h-72 Z" fill="#264234"/>
      <g fill="#fffbff">
        <rect x="852" y="190" width="40" height="40" transform="rotate(-12 872 210)"/>
        <rect x="864" y="250" width="40" height="40" transform="rotate(9 884 270)"/>
        <rect x="850" y="308" width="40" height="40" transform="rotate(-6 870 328)"/>
      </g>
      <path d="M908 138 l-26 86" stroke="#000" stroke-width="8" fill="none"/>
      <circle cx="914" cy="126" r="32" fill="#ef1c21" stroke="#000" stroke-width="4"/>
      <g stroke="#000" stroke-width="3">
        <path d="M914 94 v64 M882 126 h64 M891 103 l46 46 M937 103 l-46 46"/>
      </g>
      <!-- coupe -->
      <path d="M698 218 h126 a63 63 0 0 1 -126 0 Z" fill="#000"/>
      <rect x="756" y="278" width="10" height="80" fill="#000"/>
      <ellipse cx="761" cy="364" rx="54" ry="13" fill="#000"/>
      <path class="s-clay" d="M814 174 l-50 54" stroke="#c2603c" stroke-width="6" fill="none"/>
      <circle class="f-olive" cx="818" cy="170" r="11" fill="#3f6b52"/>
      <!-- counter -->
      <rect x="675" y="374" width="283" height="6" fill="#000"/>
    </g>
  </svg>
  </div>

  <h1>צ'אצ'י <i>X</i> ויויאן</h1>

  <div class="kicker">
    <div class="tag">ריקאברי בר</div>
    <div class="lat">b y &nbsp; V i v i a n &nbsp; X</div>
  </div>

  <div class="rule"></div>

  <p class="lede">
    המיקסולוג צ'אצ'י מגיע להופעת אורח<br>
    תפריט קיץ מושלם ליום שאחרי<br>
    <b>ריקאברי בר חד פעמי</b>
  </p>

  <div class="rule thin"></div>

  <div class="details">
    <div class="col-when">
      <div class="big" dir="ltr">12:00-18:00</div>
      <div class="big">מגן אברהם 6</div>
      <div class="sub">שוק הפישפשים - יפו</div>
    </div>
    <div class="col-who">
      <div class="lbl">על העמדה</div>
      <div class="dj">DJ זוהרה</div>
    </div>
  </div>

  <div class="rule thin"></div>
  <div class="bullets" dir="ltr">Come Curious<i>.</i></div>
  <div class="rule thin" style="margin-top:0"></div>

  <footer>
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9">
      <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5"/>
      <circle cx="12" cy="12" r="4.6"/><circle cx="17.6" cy="6.4" r="1.3" fill="#000" stroke="none"/>
    </svg>
    <span>tutlavi_studio</span>
  </footer>

</div></div>
</html>

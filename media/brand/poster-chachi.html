<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>צ'אצ'י X ויויאן — Pop up Cocktail party · סטודיו תות</title>
<style>
  @font-face{font-family:Tut;src:url('../../fonts/anomalia-ultrabold-aaa.otf');font-weight:900}
  @font-face{font-family:Tut;src:url('../../fonts/anomalia-demibold-aaa.otf');font-weight:600}
  @font-face{font-family:TutText;src:url('../../fonts/almoni-tzar-light-aaa.otf');font-weight:300}
  @font-face{font-family:TutText;src:url('../../fonts/almoni-tzar-demibold-aaa.otf');font-weight:600}
  @font-face{font-family:TutMono;src:url('../../fonts/index-mono-bold-aaa.otf')}

  :root{ --red:#ef1c21; --clay:#c2603c; --olive:#3f6b52; --deep:#264234; --ink:#000; --paper:#fffbff; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e9e9e9;display:flex;justify-content:center}

  .poster{width:1080px;height:1350px;background:var(--red);padding:24px}
  .paper{
    width:100%;height:100%;background:var(--paper);
    padding:38px 60px 28px;display:flex;flex-direction:column;position:relative;
  }
  .bh{position:absolute;top:16px;left:26px;font:300 19px TutText;color:#111}

  /* ---- header ---- */
  header{display:flex;align-items:center;justify-content:space-between}
  .wordmark{width:290px;display:block}
  .daycircle{
    width:188px;height:188px;border-radius:50%;background:var(--red);
    box-shadow:0 0 0 9px var(--paper), 0 0 0 14px var(--clay);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-8deg);
  }
  .daycircle b{font:900 30px/1 Tut;color:#000;letter-spacing:-.5px}
  .daycircle span{font:900 52px/1 Tut;color:#000;margin-top:10px;letter-spacing:-1px}

  /* ---- art ---- */
  .art{margin:18px 0 0}
  .art svg{width:100%;display:block}

  /* ---- headline ---- */
  h1{font:900 92px/.94 Tut;letter-spacing:-2px;text-align:right;margin-top:18px}
  h1 i{color:var(--red);font-style:normal}
  .kicker{display:flex;align-items:center;gap:22px;margin-top:13px}
  .tag{background:var(--olive);color:var(--paper);font:900 32px/1 Tut;padding:10px 22px}
  .lat{font:400 22px/1 TutMono;letter-spacing:8px;color:#111}

  .rule{height:4px;background:#000;margin-top:17px}
  .rule.thin{height:2px}

  .lede{font:300 35px/1.26 TutText;text-align:right;margin:15px 0 0}
  .lede em{font-weight:600;font-style:normal}
  .lede b{color:var(--clay);font-weight:600}

  /* ---- details ---- */
  .details{display:flex;align-items:center;gap:32px;margin-top:15px}
  .col-when{text-align:right;padding-left:32px;border-left:3px solid #000}
  .col-when .big{font:900 46px/1.14 Tut;letter-spacing:-1px}
  .col-when .sub{font:300 26px/1.3 TutText;margin-top:5px;color:#222}
  .col-who{flex:1;display:flex;flex-direction:column;gap:11px;text-align:center}
  .col-who .n{font:400 28px/1 TutMono;letter-spacing:11px;padding-right:11px}
  .col-who .n.hb{font:600 30px/1 TutText;letter-spacing:7px}

  .bullets{font:900 30px/1 Tut;text-align:center;padding:14px 0}
  .bullets i{color:var(--red);font-style:normal;padding:0 10px}
  .bullets i.c{color:var(--clay)} .bullets i.o{color:var(--olive)}

  footer{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:13px;padding-top:12px}
  footer svg{width:32px;height:32px}
  footer span{font:400 27px/1 TutMono;letter-spacing:10px;padding-right:10px}
</style>

<div class="poster"><div class="paper">
  <div class="bh">ב"ה</div>

  <header>
    <img class="wordmark" src="wordmark-studio-tut.png" alt="סטודיו תות">
    <div class="daycircle"><b>שישי צהריים</b><span>31/7</span></div>
  </header>

  <div class="art">
  <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#000" stroke-width="3">
      <rect x="1.5"   y="1.5" width="334" height="397"/>
      <rect x="347.5" y="1.5" width="314" height="397"/>
      <rect x="673.5" y="1.5" width="285" height="397"/>
    </g>

    <!-- ================= LEFT PANEL: arch · red sun · stairs · DJ booth ================= -->
    <clipPath id="cL"><rect x="3" y="3" width="331" height="394"/></clipPath>
    <g clip-path="url(#cL)">
      <!-- red sun -->
      <circle cx="272" cy="78" r="45" fill="#ef1c21"/>
      <!-- concentric arch -->
      <path d="M32 250 V170 a84 84 0 0 1 168 0 V250" fill="none" stroke="#000"     stroke-width="26"/>
      <path d="M72 250 V172 a44 44 0 0 1  88 0 V250" fill="none" stroke="#c2603c" stroke-width="11"/>
      <path d="M94 250 V174 a22 22 0 0 1  44 0 V250" fill="none" stroke="#3f6b52" stroke-width="6"/>
      <!-- clay stairs -->
      <path d="M216 250 V212 h32 V182 h32 V152 h34 V250 Z" fill="#c2603c"/>
      <!-- upper floor -->
      <rect x="3" y="250" width="331" height="6" fill="#000"/>

      <!-- ---- DJ booth ---- -->
      <!-- laptop -->
      <g stroke="#000" stroke-width="3">
        <path d="M266 286 L310 286 L316 248 L272 248 Z" fill="#fffbff"/>
        <path d="M260 286 L316 286 L322 296 L254 296 Z" fill="#3f6b52"/>
      </g>
      <!-- deck 1 -->
      <g stroke="#000" stroke-width="3">
        <rect x="30" y="286" width="80" height="44" fill="#fffbff"/>
        <rect x="120" y="286" width="44" height="44" fill="#fffbff"/>
        <rect x="174" y="286" width="80" height="44" fill="#fffbff"/>
      </g>
      <circle cx="70"  cy="308" r="16" fill="#000"/><circle cx="70"  cy="308" r="5" fill="#ef1c21"/>
      <circle cx="214" cy="308" r="16" fill="#000"/><circle cx="214" cy="308" r="5" fill="#ef1c21"/>
      <g stroke="#c2603c" stroke-width="4"><path d="M130 296 v24 M142 296 v24 M154 296 v24"/></g>
      <!-- booth front -->
      <rect x="20" y="330" width="300" height="12" fill="#000"/>
      <!-- stacked steps -->
      <path d="M320 342 H128 V360 H74 V378 H20 V397" fill="none" stroke="#000" stroke-width="3"/>
      <g stroke="#000" stroke-width="2">
        <path d="M320 355 H142 M320 373 H88 M320 391 H34"/>
      </g>
    </g>

    <!-- ================= MIDDLE PANEL: bar shelf + badge ================= -->
    <clipPath id="cM"><rect x="349" y="3" width="311" height="394"/></clipPath>
    <g clip-path="url(#cM)"><g transform="translate(51,0)">
      <rect x="298" y="222" width="313" height="178" fill="#264234"/>
      <!-- shaker -->
      <g stroke="#000" stroke-width="4" fill="#fffbff">
        <path d="M330 222 V126 l12 -32 h54 l12 32 V222 Z"/>
        <rect x="338" y="66" width="66" height="26" fill="#c2603c"/>
        <path d="M350 66 V50 h42 v16"/>
      </g>
      <!-- striped bottle -->
      <g stroke="#000" stroke-width="4" fill="#fffbff">
        <path d="M432 222 V116 c0 -22 15 -26 15 -45 V40 h-30 v31 c0 19 15 23 15 45 V222 Z"/>
      </g>
      <g stroke="#c2603c" stroke-width="5">
        <path d="M419 132 h26 M419 146 h26 M419 160 h26 M419 174 h26 M419 188 h26"/>
      </g>
      <!-- olive bottle -->
      <path d="M498 222 V122 c0 -22 -14 -26 -14 -44 V46 h28 v32 c0 18 14 22 14 44 V222 Z" fill="#3f6b52"/>
      <!-- coupe with citrus -->
      <g stroke="#000" stroke-width="4" fill="none">
        <path d="M540 150 h56 a28 28 0 0 1 -56 0 Z" fill="#000"/>
        <path d="M568 178 V210 M548 214 h40"/>
      </g>
      <circle cx="600" cy="140" r="20" fill="#ef1c21" stroke="#000" stroke-width="3"/>
      <g stroke="#000" stroke-width="2">
        <path d="M600 120 v40 M580 140 h40 M586 126 l28 28 M614 126 l-28 28"/>
      </g>
      <!-- shelf -->
      <rect x="298" y="216" width="313" height="7" fill="#000"/>
    </g></g>
    <!-- badge, straddling the block edge -->
    <g transform="translate(505 222)">
      <circle r="97" fill="#fffbff" stroke="#000" stroke-width="4"/>
      <circle r="86" fill="none" stroke="#000" stroke-width="2"/>
      <text y="-2" text-anchor="middle" font-family="Tut" font-weight="900" font-size="46" fill="#000">POP UP</text>
      <text y="40" text-anchor="middle" font-family="TutMono" font-size="14" letter-spacing="1.5" fill="#c2603c">COCKTAIL PARTY</text>
    </g>

    <!-- ================= RIGHT PANEL: coupe + highball ================= -->
    <clipPath id="cR"><rect x="675" y="3" width="282" height="394"/></clipPath>
    <g clip-path="url(#cR)">
      <!-- highball -->
      <path d="M834 152 h92 l-10 222 h-72 Z" fill="#264234"/>
      <g fill="#fffbff">
        <rect x="852" y="190" width="40" height="40" transform="rotate(-12 872 210)"/>
        <rect x="864" y="250" width="40" height="40" transform="rotate(9 884 270)"/>
        <rect x="850" y="308" width="40" height="40" transform="rotate(-6 870 328)"/>
      </g>
      <path d="M908 138 l-26 86" stroke="#000" stroke-width="8" fill="none"/>
      <circle cx="914" cy="126" r="32" fill="#ef1c21" stroke="#000" stroke-width="4"/>
      <g stroke="#000" stroke-width="3">
        <path d="M914 94 v64 M882 126 h64 M891 103 l46 46 M937 103 l-46 46"/>
      </g>
      <!-- coupe -->
      <path d="M698 218 h126 a63 63 0 0 1 -126 0 Z" fill="#000"/>
      <rect x="756" y="278" width="10" height="80" fill="#000"/>
      <ellipse cx="761" cy="364" rx="54" ry="13" fill="#000"/>
      <path d="M814 174 l-50 54" stroke="#c2603c" stroke-width="6" fill="none"/>
      <circle cx="818" cy="170" r="11" fill="#3f6b52"/>
      <!-- counter -->
      <rect x="675" y="374" width="283" height="6" fill="#000"/>
    </g>
  </svg>
  </div>

  <h1>צ'אצ'י <i>X</i> ויויאן</h1>

  <div class="kicker">
    <div class="tag">ריקאברי בר</div>
    <div class="lat">b y &nbsp; V i v i a n &nbsp; X</div>
  </div>

  <div class="rule"></div>

  <p class="lede">
    המיקסולוג צ'אצ'י מגיע להופעת אורח<br>
    תפריט קיץ מושלם ליום שאחרי<br>
    <b>ריקאברי בר חד פעמי</b>
  </p>

  <div class="rule thin"></div>

  <div class="details">
    <div class="col-when">
      <div class="big" dir="ltr">12:00-18:00</div>
      <div class="big">מגן אברהם 6</div>
      <div class="sub">יום שישי · תל אביב</div>
    </div>
    <div class="col-who">
      <div class="n hb">צ ' א צ ' י</div>
      <div class="n">V I V I A N</div>
    </div>
  </div>

  <div class="rule thin"></div>
  <div class="bullets">ואנחנו <i>•</i> מוזיקה <i class="c">•</i> קוקטיילים <i class="o">•</i> ריקאברי <i class="c">•</i> צהריים</div>
  <div class="rule thin" style="margin-top:0"></div>

  <footer>
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.9">
      <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5"/>
      <circle cx="12" cy="12" r="4.6"/><circle cx="17.6" cy="6.4" r="1.3" fill="#000" stroke="none"/>
    </svg>
    <span>tutlavi_studio</span>
  </footer>

</div></div>
</html>
